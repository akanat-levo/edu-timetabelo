# All traffic goes to the frontend service. The frontend's nginx serves the
# SPA and proxies /api/* to the backend service inside the cluster, so a single
# public host is all you need.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timetabelo
  namespace: timetabelo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    # Replace with your domain, or use the load balancer IP / nip.io for testing.
    - host: timetabelo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
