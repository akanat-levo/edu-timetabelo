---
# Persistent storage for the SQLite database file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: timetabelo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: timetabelo
type: Opaque
stringData:
  # CHANGE THIS before going live. Generate with: openssl rand -hex 32
  SECRET_KEY: "replace-with-a-long-random-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: timetabelo
spec:
  replicas: 1 # SQLite = single writer, keep at 1
  strategy:
    type: Recreate # avoid two pods sharing the SQLite volume
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Replace DOCKERHUB_USER with your Docker Hub username.
          image: DOCKERHUB_USER/edu-timetabelo-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite:///./data/timetable.db"
            - name: CORS_ORIGINS
              value: "*"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: timetabelo
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
