apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: timetabelo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace DOCKERHUB_USER with your Docker Hub username.
          image: DOCKERHUB_USER/edu-timetabelo-frontend:latest
          ports:
            - containerPort: 80
          env:
            # nginx proxies /api to the in-cluster backend service.
            - name: BACKEND_URL
              value: "http://backend:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: timetabelo
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
