services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:///./data/timetable.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - CORS_ORIGINS=*
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend_data:
